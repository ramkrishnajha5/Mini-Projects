<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful, modern calculator with glassmorphism design. Perform mathematical calculations with an elegant and user-friendly interface.">
    <title>Calculator - Modern Math Tool</title>
    <!-- CSS File  -->
    <link rel="stylesheet" href="style.css">
    <!-- JS File -->
    <script src="script.js" defer></script>
    <!-- Favicon Icon -->
    <link rel="icon" type="image/x-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTlGTDwVBzGvycFz_G229q2PZeGq20EeHso9g&s">
</head>
<body>
    <div class="head">
        <header class="heading">
            <h2 class="heading1">Calculate Your &nbsp;</h2>
            <h2 class="heading2">Mathematical Thoughts</h2>
        </header>
        <main class="calc" role="main" aria-label="Calculator">
            <div class="text-display">
                <input type="text" name="display" readonly id="inputBox" aria-label="Calculator display" placeholder="0">
            </div>
            <div class="buttons">
                <button class="operator" aria-label="All Clear">AC</button>
                <button class="operator" aria-label="Delete">DE</button>
                <button class="operator" aria-label="Percentage">%</button>
                <button class="operator" aria-label="Divide">/</button>
            </div>
            <div class="buttons">
                <button aria-label="Seven">7</button>
                <button aria-label="Eight">8</button>
                <button aria-label="Nine">9</button>
                <button class="operator" aria-label="Multiply">*</button>
            </div>
            <div class="buttons">
                <button aria-label="Four">4</button>
                <button aria-label="Five">5</button>
                <button aria-label="Six">6</button>
                <button class="operator" aria-label="Subtract">-</button>
            </div>
            <div class="buttons">
                <button aria-label="One">1</button>
                <button aria-label="Two">2</button>
                <button aria-label="Three">3</button>
                <button class="operator" aria-label="Add">+</button>
            </div>
            <div class="buttons">
                <button aria-label="Double Zero">00</button>
                <button aria-label="Zero">0</button>
                <button aria-label="Decimal point">.</button>
                <button class="equal" aria-label="Equals">=</button>
            </div>
        </main>
    </div>
</body>
</html>
