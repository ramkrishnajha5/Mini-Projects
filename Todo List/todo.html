<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Organize your tasks with a beautiful, modern todo list. Features priority levels, filters, progress tracking, and local storage.">
    <!-- JavaScript File -->
    <script src="./todo.js" defer></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- CSS File -->
    <link rel="stylesheet" href="todo.css">
    <title>To Do List - Task Manager</title>
    <!-- Fevicon Image -->
    <link rel="icon" type="image/x-icon"
        href="https://cdn.pixabay.com/photo/2016/03/31/19/50/checklist-1295319_640.png">
</head>

<body>
    <main>
        <h1 class="heading">TO DO LIST</h1>

        <!-- Priority Selector -->
        <div class="priority-select">
            <button class="priority-btn active" data-priority="low">Low</button>
            <button class="priority-btn" data-priority="medium">Medium</button>
            <button class="priority-btn" data-priority="high">High</button>
        </div>

        <!-- Todo Input Form -->
        <form action="" class="todo-list">
            <input type="text" name="" id="text" placeholder="Type your task here..." autocomplete="off">
            <input type="submit" value="Add Todo" id="submit">
        </form>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button class="filter-btn active-filter" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
            <h3>Progress: <span id="progress-text">0% Complete</span></h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Reset and Save Buttons -->
        <div class="resetbtn">
            <button class="reset"><i class="fa-solid fa-arrows-rotate"></i> Reset</button>
            <button class="save"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        </div>
    </main>

    <!-- Todo List Container -->
    <div class="list-conatiner">
        <ul class="list-items">
        </ul>
    </div>
</body>

</html>
