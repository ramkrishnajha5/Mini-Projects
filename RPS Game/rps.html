<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Play Rock Paper Scissors game with beautiful animations and score tracking. Challenge the computer in this classic game with a modern twist.">
    <title>Rock Paper Scissors - Interactive Game</title>
    <!-- CSS File -->
    <link rel="stylesheet" href="rps.css">
    <!-- Link JavaScript File -->
    <script src="rps.js" defer></script>
</head>

<body>
    <h1 class="heading">Rock Paper Scissors</h1>
    <div class="btn">
        <button id="rock" aria-label="Rock">✊</button>
        <button id="paper" aria-label="Paper">🖐️</button>
        <button id="scissor" aria-label="Scissors">✌️</button>
    </div>
    <div class="choose">
        <p class="yourChoose"></p>
        <p class="computerChoose"></p>
    </div>
    <div class="result-box">
        <h1 class="result"></h1>
        <div class="score-board">
            <p class="you"></p>
            <p class="computer"></p>
        </div>
        <button id="restart" aria-label="Restart Game">RESTART</button>
    </div>
</body>

</html>
